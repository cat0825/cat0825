<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Rāna, AI systems reliability engineer" data-mode="dark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131A"/><stop offset="1" stop-color="#10141F"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00A7D1"/><stop offset="1" stop-color="#E84A8A"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17313C" stroke-width="1"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .label{font-size:12px;letter-spacing:3px;font-weight:700}.micro{font-size:10px;letter-spacing:2px}
    .flow{stroke-dasharray:7 9;animation:flow 8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 24s linear infinite}.blink{animation:blink 2s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-160}}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.blink{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)" opacity=".7"/>
    <path d="M0 330C250 290 390 220 600 118S930 24 1200 0V420H0Z" fill="#00A7D1" opacity=".035"/>
    <path d="M680 0l270 420h250V0Z" fill="#E84A8A" opacity=".04"/>
    <path d="M0 1h1200" stroke="url(#accent)" stroke-width="2"/>
    <g transform="translate(22 22)"><circle cx="0" cy="0" r="4" fill="#EF4B5A"/><circle cx="18" cy="0" r="4" fill="#E6A425"/><circle cx="36" cy="0" r="4" fill="#22A447"/>
      <text x="58" y="4" class="micro" fill="#8BA9B5">RĀNA(BASS VER.) / SECOND_RESUME</text></g>
    <g transform="translate(1046 22)"><circle class="blink" cx="0" cy="0" r="4" fill="#00A7D1" filter="url(#glow)"/><text x="14" y="4" class="micro" fill="#8BA9B5">SYSTEM ONLINE</text></g>
    <path d="M0 44h1200" stroke="#2B4A57"/>
    <text x="38" y="91" class="label" fill="#00A7D1">// AI SYSTEMS RELIABILITY / OPEN SOURCE</text>
    <text x="38" y="160" font-size="52" font-weight="900" letter-spacing="-2" fill="#E7F7FC">FIX THE EDGE.</text>
    <text x="38" y="218" font-size="45" font-weight="900" letter-spacing="-1.5" fill="#E7F7FC">KEEP THE SYSTEM.</text>
    <text x="40" y="253" font-size="13" letter-spacing="2" fill="#8BA9B5">I FIND THE "WORKS UNTIL IT DOESN'T" PATHS AND CLOSE THEM.</text>
    <g transform="translate(1005 147)"><circle r="70" fill="none" stroke="#2B4A57"/><circle class="orbit" r="54" fill="none" stroke="#00A7D1" stroke-width="1.5" stroke-dasharray="8 10" opacity=".65"/>
      <g stroke="#00A7D1" opacity=".6"><path d="M0-70V-24M61-35L21-12M61 35L21 12M0 70V24M-61 35L-21 12M-61-35L-21-12"/></g>
      <circle r="18" fill="#0C1C24" stroke="#00A7D1" filter="url(#glow)"/><circle class="pulse" r="5" fill="#00A7D1"/>
      <g fill="#0C1C24" stroke="#00A7D1"><circle cy="-70" r="6"/><circle cx="61" cy="-35" r="6"/><circle cx="61" cy="35" r="6"/><circle cy="70" r="6"/><circle cx="-61" cy="35" r="6"/><circle cx="-61" cy="-35" r="6"/></g></g>
    <text x="953" y="239" class="micro" fill="#8BA9B5">BOUNDARY / LOOP</text>
    <text x="22" y="286" class="micro" fill="#E84A8A">EVIDENCE / UPDATED 2026-10-17</text>
    <g transform="translate(22 302)">
      <rect width="356" height="94" rx="7" fill="#0C1C24" fill-opacity=".82" stroke="#00A7D1" stroke-opacity=".55"/>
      <text x="18" y="24" class="micro" fill="#8BA9B5">MERGED INTO OTHER PROJECTS</text>
      <text x="18" y="62" font-size="30" font-weight="900" fill="#E7F7FC">31 PRs</text><text x="126" y="62" font-size="12" fill="#8BA9B5">/ 16 repositories</text>
      <text x="18" y="82" font-size="9" fill="#8BA9B5">PUBLIC SEARCH, 2026-10-17</text>
    </g>
    <g transform="translate(393 302)">
      <rect width="356" height="94" rx="7" fill="#0C1C24" fill-opacity=".82" stroke="#E84A8A" stroke-opacity=".55"/>
      <text x="18" y="24" class="micro" fill="#8BA9B5">CURRENT CONTRIBUTION WINDOW</text>
      <text x="18" y="62" font-size="30" font-weight="900" fill="#E7F7FC">903</text><text x="77" y="62" font-size="12" fill="#8BA9B5">contributions</text>
      <text x="18" y="82" font-size="9" fill="#8BA9B5">90 ACTIVE DAYS / LAST 12 MONTHS</text>
    </g>
    <g transform="translate(764 302)">
      <rect width="414" height="94" rx="7" fill="#0C1C24" fill-opacity=".82" stroke="#00A7D1" stroke-opacity=".55"/>
      <text x="18" y="24" class="micro" fill="#8BA9B5">SCOPE</text>
      <text x="18" y="49" font-size="12" font-weight="700" fill="#E7F7FC">AGENT RUNTIMES · MEMORY · MCP</text>
      <text x="18" y="69" font-size="12" font-weight="700" fill="#E7F7FC">RENDERING · DOCUMENT PIPELINES</text>
      <text x="18" y="86" font-size="9" fill="#8BA9B5">FOCUSED CHANGES WITH REPRODUCIBLE TESTS</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#00A7D1" stroke-opacity=".72"/>
</svg>
